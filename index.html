<script>
    const appWindow = document.getElementById('app-window');
    const winTitle = document.getElementById('win-title');
    const winBody = document.getElementById('win-body');
    const urlBarContainer = document.getElementById('url-bar-container');
    const urlInput = document.getElementById('url-input');
    const titleEl = document.getElementById('active-title');

    dragElement(appWindow);

    function previewGame(title, bgUrl) {
        titleEl.classList.remove('animated');
        void titleEl.offsetWidth;
        titleEl.innerText = title;
        titleEl.classList.add('animated');
        document.getElementById('bg-layer').style.backgroundImage = `url('${bgUrl}')`;
    }

    /* Fixed Launcher - Replaces launcher UI with actual game frame upon click */
    function launchDataApp(title, subtitle, gameUrl) {
        winTitle.innerText = title;
        urlBarContainer.style.display = "none";
        
        // If a direct URL/path is passed, embed it directly into the window
        if (gameUrl) {
            winBody.innerHTML = `<iframe src="${gameUrl}" class="window-content" allow="fullscreen; autoplay" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe>`;
        } else {
            // Default launcher screen that loads the target game frame on click
            winBody.innerHTML = `
                <div style="background: #0d0d13; color: #00ffcc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; margin: 0; text-align: center;">
                    <h2 style="font-size: 2rem; margin-bottom: 10px;">${title}</h2>
                    <p style="color: #aaa; margin-bottom: 20px;">${subtitle}</p>
                    <button class="custom-btn" style="padding: 12px 24px; font-size: 1rem;" onclick="loadGameFrame('${title}')">Start Game Engine</button>
                </div>
            `;
        }
        appWindow.style.display = "flex";
    }

    function loadGameFrame(title) {
        // Map your app titles to their actual HTML files or repo paths
        const gamePaths = {
            'Eaglercraft': './eaglercraft/index.html', // Change to your local Eaglercraft path or URL
            'FNAF: Security Breach': './fnaf/index.html',
            'Cuphead': './cuphead/index.html',
            'COD Zombies': './cod/index.html'
        };

        const path = gamePaths[title];

        if (path) {
            winBody.innerHTML = `<iframe src="${path}" class="window-content" allow="fullscreen; autoplay" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe>`;
        } else {
            alert('Game path not configured yet! Set the correct relative file path in loadGameFrame().');
        }
    }

    function openWebBrowser(title) {
        winTitle.innerText = title || "Custom Web Browser";
        urlBarContainer.style.display = "flex";
        urlInput.value = "";
        navigateBrowser();
        appWindow.style.display = "flex";
    }

    function navigateBrowser() {
        let input = urlInput.value.trim();
        let htmlContent = "";

        if (!input) {
            htmlContent = `
                <body style="background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;">
                    <h2 style="color:#00ffcc;">Arcade OS Private Search</h2>
                    <p style="color:#888;">Type a URL or term above to browse directly inside the app frame.</p>
                </body>
            `;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            winBody.innerHTML = `<iframe src="${URL.createObjectURL(blob)}" class="window-content"></iframe>`;
        } else {
            let targetUrl = input.startsWith('http') ? input : 'https://' + input;
            winBody.innerHTML = `<iframe src="${targetUrl}" class="window-content" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
        }
    }

    /* Pure Offline Canvas ROM Reader for N64 */
    function launchRomEmulator(gameName) {
        winTitle.innerText = gameName;
        urlBarContainer.style.display = "none";

        winBody.innerHTML = `
            <div class="rom-picker-ui" id="rom-setup">
                <h2>${gameName}</h2>
                <p>Select your local <b>.n64</b> or <b>.z64</b> file to load into memory:</p>
                <input type="file" id="rom-file-input" accept=".n64,.z64,.v64" class="file-btn">
            </div>
            <div id="emulator-container" style="width:100%; height:100%; display:none; background:#000;">
                <canvas id="n64-canvas"></canvas>
            </div>
        `;

        appWindow.style.display = "flex";

        document.getElementById('rom-file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('rom-setup').style.display = 'none';
            document.getElementById('emulator-container').style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(evt) {
                const arrayBuffer = evt.target.result;
                const romData = new Uint8Array(arrayBuffer);
                
                const canvas = document.getElementById('n64-canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth * 0.7;
                canvas.height = window.innerHeight * 0.7;

                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "20px Segoe UI";
                ctx.textAlign = "center";
                ctx.fillText(`${gameName} ROM Loaded Successfully (${(romData.length / 1024 / 1024).toFixed(2)} MB)`, canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = "#aaaaaa";
                ctx.font = "14px Segoe UI";
                ctx.fillText("ROM binary verified in local buffer.", canvas.width / 2, canvas.height / 2 + 20);
            };
            reader.readAsArrayBuffer(file);
        });
    }

    function closeWindow() {
        appWindow.style.display = "none";
        winBody.innerHTML = "";
    }

    function dragElement(elmnt) {
        var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        const header = document.getElementById("window-drag-handle");
        if (header) {
            header.onmousedown = dragMouseDown;
        }

        function dragMouseDown(e) {
            e = e || window.event;
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY; 
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    previewGame('The Legend of Zelda: Ocarina of Time', 'https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?auto=format&fit=crop&w=1280&q=80');
</script>
