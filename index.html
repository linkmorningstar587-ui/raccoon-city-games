<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f13;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 15px;
            background-color: #1a1a24;
            text-align: center;
            border-bottom: 2px solid #00ffcc;
        }
        h1 {
            margin: 0;
            color: #00ffcc;
            font-size: 1.8rem;
        }
        .nav-buttons {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background-color: #2a2a3a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #00ffcc;
            color: #000000;
        }
        #viewport {
            width: 90%;
            max-width: 900px;
            height: 600px;
            border: 2px solid #33334d;
            border-radius: 8px;
            background-color: #000000;
            position: relative;
        }
    </style>
</head>
<body>

    <header>
        <h1>Arcade & Retro Hub</h1>
    </header>

    <div class="nav-buttons">
        <button onclick="loadWebGame('https://html5.gamedistribution.com/rvvAS300/a31c360b947c4333b28b7e6ee57a7e3d/')">HTML5 Game</button>
        <button onclick="loadROM('https://files.catbox.moe/gvd73l.z64', 'n64')">N64 Game 1</button>
        <button onclick="loadROM('https://files.catbox.moe/y3zvb0.z64', 'n64')">N64 Game 2</button>
    </div>

    <div id="viewport">
        <div id="game" style="width:100%; height:100%;"></div>
    </div>

    <script>
        function loadWebGame(url) {
            const container = document.getElementById('game');
            container.innerHTML = `<iframe src="${url}" style="width:100%; height:100%; border:none;" allowgamepad allowfullscreen></iframe>`;
        }

        function loadROM(romUrl, system) {
            const container = document.getElementById('game');
            container.innerHTML = '';

            window.EJS_player = '#game';
            window.EJS_core = system; // 'n64', 'gba', 'nds', 'nes', 'snes'
            window.EJS_gameUrl = romUrl;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        }

        // Default start game (loads first N64 game on page load)
        loadROM('https://files.catbox.moe/gvd73l.z64', 'n64');
    </script>

</body>
</html>
