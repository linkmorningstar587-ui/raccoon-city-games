<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade OS | Unblocked Preloaded Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ffcc;
            padding-bottom: 10px;
        }

        .header h1 { color: #00ffcc; font-size: 1.8rem; }

        .banner {
            background: #161b22;
            border: 1px dashed #00ffcc;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .banner a {
            background: #00ffcc;
            color: #000;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }

        .section-title {
            color: #00ffcc;
            margin-top: 15px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin: 8px 0;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .grid::-webkit-scrollbar { width: 5px; }
        .grid::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

        .btn {
            background: #21262d;
            border: 2px solid #30363d;
            color: #00ffcc;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn:hover { border-color: #00ffcc; background: #30363d; }
        .btn-cuphead { color: #ffb86c; border-color: #ffb86c; }
        .btn-cuphead:hover { background: #ffb86c; color: #000; }
        .btn-retro { color: #ff79c6; border-color: #ff79c6; }
        .btn-retro:hover { background: #ff79c6; color: #000; }

        .screen {
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 10px 0;
            overflow: hidden;
        }

        #game-area {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls {
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div>
        <div class="header">
            <h1>ARCADE OS</h1>
            <span>PRELOADED HUB</span>
        </div>
        <div class="banner">
            <span>Want a custom site layout? Email me!</span>
            <a href="mailto:linkmorningstar587@gmail.com?subject=Custom%20Layout%20Request">Email Me</a>
        </div>
    </div>

    <div class="screen">
        <div id="game-area">
            <h2 style="color: #8b949e;">Select a game below to launch!</h2>
        </div>
    </div>

    <div class="controls" id="instructions">Controls: Arrow Keys / Spacebar</div>

    <!-- Cuphead Action Engine -->
    <div class="section-title">Boss Action</div>
    <div class="grid">
        <button class="btn btn-cuphead" onclick="playCuphead()">Cuphead Boss Rush</button>
    </div>

    <!-- Built-In Preloaded Retro Engine Games -->
    <div class="section-title">Preloaded Retro Classics</div>
    <div class="grid">
        <button class="btn btn-retro" onclick="playMario()">Super Mario Quest</button>
        <button class="btn btn-retro" onclick="playZelda()">Zelda Dungeon Explorer</button>
        <button class="btn btn-retro" onclick="playPacman()">Pac-Man Arcade</button>
        <button class="btn btn-retro" onclick="playSonic()">Sonic Dash</button>
    </div>

    <!-- Offline Minigames -->
    <div class="section-title">Offline Arcade Minigames</div>
    <div class="grid">
        <button class="btn" onclick="playSnake()">Snake</button>
        <button class="btn" onclick="playPong()">Pong</button>
        <button class="btn" onclick="playFlappy()">Flappy Box</button>
        <button class="btn" onclick="play2048()">2048</button>
        <button class="btn" onclick="playBreakout()">Breakout</button>
    </div>

    <script>
        const area = document.getElementById('game-area');
        const inst = document.getElementById('instructions');
        let timer = null;

        function stopGame() {
            if (timer) clearInterval(timer);
            window.onkeydown = null;
            window.onkeyup = null;
        }

        /* 1. CUPHEAD BOSS ENGINE */
        function playCuphead() {
            stopGame();
            inst.innerText = "A/D: Move | SPACE: Jump | J: Shoot Pea Shooter";
            area.innerHTML = '<canvas id="gc" width="300" height="260" style="background:#1a1005; border:1px solid #ffb86c;"></canvas>';
            const canvas = document.getElementById('gc');
            const ctx = canvas.getContext('2d');

            let px = 30, py = 180, vy = 0, jumping = false;
            let bossY = 80, bossDir = 1, bossHp = 50;
            let bullets = [], bossAttacks = [];
            let keys = {};

            window.onkeydown = e => keys[e.key.toLowerCase()] = true;
            window.onkeyup = e => keys[e.key.toLowerCase()] = false;

            timer = setInterval(() => {
                if (keys['a'] && px > 10) px -= 3;
                if (keys['d'] && px < 260) px += 3;
                if ((keys[' '] || keys['w']) && !jumping) { vy = -8; jumping = true; }

                vy += 0.5; py += vy;
                if (py >= 180) { py = 180; vy = 0; jumping = false; }

                if (keys['j'] && Math.random() < 0.3) {
                    bullets.push({x: px + 20, y: py + 10});
                }

                bossY += 1.5 * bossDir;
                if (bossY > 150 || bossY < 30) bossDir *= -1;

                if (Math.random() < 0.04) {
                    bossAttacks.push({x: 230, y: bossY + 20, speed: Math.random() * 2 + 2});
                }

                bullets.forEach((b, i) => {
                    b.x += 6;
                    if (b.x > 230 && b.y > bossY && b.y < bossY + 60) {
                        bossHp--;
                        bullets.splice(i, 1);
                    }
                });

                bossAttacks.forEach((a, i) => {
                    a.x -= a.speed;
                    if (a.x < px + 15 && a.x > px && a.y > py && a.y < py + 20) {
                        alert("KNOCKOUT! Boss defeated you.");
                        playCuphead();
                    }
                });

                if (bossHp <= 0) {
                    alert("A WINNER IS YOU! Boss Defeated!");
                    playCuphead();
                }

                ctx.fillStyle = "#1a1005"; ctx.fillRect(0,0,300,260);
                ctx.fillStyle = "#ffb86c"; ctx.fillRect(0, 200, 300, 60);
                ctx.fillStyle = "#ff5555"; ctx.fillRect(px, py, 16, 20);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(px + 2, py - 6, 12, 6);
                ctx.fillStyle = "#50fa7b"; ctx.fillRect(230, bossY, 50, 60);
                ctx.fillStyle = "#ff5555"; ctx.fillRect(230, 10, 50, 6);
                ctx.fillStyle = "#50fa7b"; ctx.fillRect(230, 10, (bossHp/50)*50, 6);
                ctx.fillStyle = "#f1fa8c"; bullets.forEach(b => ctx.fillRect(b.x, b.y, 6, 3));
                ctx.fillStyle = "#ff79c6"; bossAttacks.forEach(a => { ctx.beginPath(); ctx.arc(a.x, a.y, 5, 0, Math.PI*2); ctx.fill(); });
            }, 20);
        }

        /* 2. SUPER MARIO QUEST */
        function playMario() {
            stopGame();
            inst.innerText = "A/D: Move | SPACE: Jump";
            area.innerHTML = '<canvas id="gc" width="300" height="260" style="background:#5c94fc;"></canvas>';
            const canvas = document.getElementById('gc');
            const ctx = canvas.getContext('2d');
            let px = 20, py = 200, vy = 0, jumping = false, keys = {};

            window.onkeydown = e => keys[e.key.toLowerCase()] = true;
            window.onkeyup = e => keys[e.key.toLowerCase()] = false;

            timer = setInterval(() => {
                if (keys['a'] && px > 0) px -= 3;
                if (keys['d'] && px < 280) px += 3;
                if ((keys[' '] || keys['w']) && !jumping) { vy = -9; jumping = true; }

                vy += 0.5; py += vy;
                if (py >= 200) { py = 200; vy = 0; jumping = false; }

                ctx.fillStyle = "#5c94fc"; ctx.fillRect(0,0,300,260);
                ctx.fillStyle = "#e36b00"; ctx.fillRect(0, 220, 300, 40); // Ground
                ctx.fillStyle = "#b84400"; ctx.fillRect(100, 150, 40, 20); // Brick
                ctx.fillStyle = "#ff5555"; ctx.fillRect(px, py, 16, 20); // Mario
            }, 20);
        }

        /* 3. ZELDA DUNGEON EXPLORER */
        function playZelda() {
            stopGame();
            inst.innerText = "Use Arrow Keys to explore dungeon";
            area.innerHTML = '<canvas id="gc" width="300" height="260" style="background:#222;"></canvas>';
            const canvas = document.getElementById('gc');
            const ctx = canvas.getContext('2d');
            let px = 140, py = 120;

            window.onkeydown = e => {
                if (e.key === 'ArrowLeft' && px > 20) px -= 10;
                if (e.key === 'ArrowRight' && px < 260) px += 10;
                if (e.key === 'ArrowUp' && py > 20) py -= 10;
                if (e.key === 'ArrowDown' && py < 220) py += 10;
            };

            timer = setInterval(() => {
                ctx.fillStyle = "#111"; ctx.fillRect(0,0,300,260);
                ctx.strokeStyle = "#50fa7b"; ctx.lineWidth = 4; ctx.strokeRect(10,10,280,240); // Walls
                ctx.fillStyle = "#50fa7b"; ctx.fillRect(px, py, 16, 16); // Link
                ctx.fillStyle = "#f1fa8c"; ctx.fillRect(140, 20, 16, 16); // Triforce
            }, 50);
        }

        /* 4. PAC-MAN ARCADE */
        function playPacman() {
            stopGame();
            inst.innerText = "Arrow Keys to turn Pac-Man";
            area.innerHTML = '<canvas id="gc" width="300" height="260" style="background:#000;"></canvas>';
            const canvas = document.getElementById('gc');
            const ctx = canvas.getContext('2d');
            let px = 30, py = 130, dx = 2, dy = 0;

            window.onkeydown = e => {
                if (e.key === 'ArrowLeft') { dx = -2; dy = 0; }
                if (e.key === 'ArrowRight') { dx = 2; dy = 0; }
                if (e.key === 'ArrowUp') { dx = 0; dy = -2; }
                if (e.key === 'ArrowDown') { dx = 0; dy = 2; }
            };

            timer = setInterval(() => {
                px += dx; py += dy;
                if (px < 0) px = 300; if (px > 300) px = 0;
                if (py < 0) py = 260; if (py > 260) py = 0;

                ctx.fillStyle = "#000"; ctx.fillRect(0,0,300,260);
                ctx.fillStyle = "#f1fa8c"; ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI*2); ctx.fill(); // Pacman
                ctx.fillStyle = "#ff79c6"; ctx.fillRect(200, 120, 14, 14); // Ghost
            }, 20);
        }

        /* 5. SONIC DASH */
        function playSonic() {
            stopGame();
            inst.innerText = "Press SPACE to jump over spikes";
            area.innerHTML = '<canvas id="gc" width="300" height="260" style="background:#282a36;"></canvas>';
            const canvas = document.getElementById('gc');
            const ctx = canvas.getContext('2d');
            let py = 180, vy = 0, sx = 300;

            window.onkeydown = e => { if ((e.code === 'Space' || e.key === ' ') && py === 180) vy = -9; };

            timer = setInterval(() => {
                vy += 0.5; py += vy;
                if (py >= 180) { py = 180; vy = 0; }
                sx -= 5; if (sx < -20) sx = 300;

                ctx.fillStyle = "#282a36"; ctx.fillRect(0,0,300,260);
                ctx.fillStyle = "#50fa7b"; ctx.fillRect(0, 200, 300, 60); // Grass
                ctx.fillStyle = "#bd93f9"; ctx.fillRect(30, py, 18, 18); // Sonic
                ctx.fillStyle = "#ff5555"; ctx.fillRect(sx, 185, 15, 15); // Spike
            }, 20);
        }

        /* BUILT-IN MINIGAMES */
        function playSnake() {
            stopGame();
            inst.innerText = "Arrow Keys to steer";
            area.innerHTML = '<canvas id="gc" width="300" height="260" style="background:#111;"></canvas>';
            const canvas = document.getElementById('gc');
            const ctx = canvas.getContext('2d');
            let px=10, py=10, gs=13, tc=20, ax=15, ay=15, xv=1, yv=0, trail=[], tail=5;

            window.onkeydown = function(e) {
                if(e.key==='ArrowLeft' && xv!==1) {xv=-1;yv=0;}
                if(e.key==='ArrowUp' && yv!==1) {xv=0;yv=-1;}
                if(e.key==='ArrowRight' && xv!==-1) {xv=1;yv=0;}
                if(e.key==='ArrowDown' && yv!==-1) {xv=0;yv=1;}
            };

            timer = setInterval(function() {
                px+=xv; py+=yv;
                if(px<0) px=tc-1; if(px>tc-1) px=0;
                if(py<0) py=tc-1; if(py>tc-1) py=0;
                ctx.fillStyle="#111"; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle="#00ffcc";
                for(let i=0;i<trail.length;i++) {
                    ctx.fillRect(trail[i].x*gs, trail[i].y*gs, gs-2, gs-2);
                    if(trail[i].x===px && trail[i].y===py) tail=5;
                }
                trail.push({x:px,y:py});
                while(trail.length>tail) trail.shift();
                if(ax===px && ay===py) { tail++; ax=Math.floor(Math.random()*tc); ay=Math.floor(Math.random()*tc); }
                ctx.fillStyle="#ff5555"; ctx.fillRect(ax*gs, ay*gs, gs-2, gs-2);
            }, 100);
        }

        function playPong() {
            stopGame();
            inst.innerText = "UP and DOWN arrows to move paddle";
            area.innerHTML = '<canvas id="gc" width="300" height="260" style="background:#111;"></canvas>';
            const canvas = document.getElementById('gc');
            const ctx = canvas.getContext('2d');
            let py=100, p2y=100, bx=150, by=130, dx=3, dy=3;

            window.onkeydown = function(e) {
                if(e.key==='ArrowUp' && py>0) py-=20;
                if(e.key==='ArrowDown' && py<200) py+=20;
            };

            timer = setInterval(function() {
                bx+=dx; by+=dy;
                if(by<=0 || by>=250) dy=-dy;
                if(by > p2y+30 && p2y<200) p2y+=2;
                if(by < p2y+30 && p2y>0) p2y-=2;
                if(bx<=15 && by>=py && by<=py+60) dx=-dx;
                if(bx>=280 && by>=p2y && by<=p2y+60) dx=-dx;
                if(bx<0 || bx>300) { bx=150; by=130; }

                ctx.fillStyle="#111"; ctx.fillRect(0,0,300,260);
                ctx.fillStyle="#00ffcc"; ctx.fillRect(5, py, 10, 60); ctx.fillRect(285, p2y, 10, 60);
                ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI*2); ctx.fill();
            }, 20);
        }

        function playFlappy() {
            stopGame();
            inst.innerText = "SPACEBAR to jump";
            area.innerHTML = '<canvas id="gc" width="300" height="260" style="background:#111;"></canvas>';
            const canvas = document.getElementById('gc');
            const ctx = canvas.getContext('2d');
            let py=130, vy=0, bx=300, gap=80, hole=Math.floor(Math.random()*120)+30;

            window.onkeydown = function(e) { if(e.code==='Space'||e.key===' ') vy=-6; };

            timer = setInterval(function() {
                vy+=0.4; py+=vy; bx-=3;
                if(bx<-30) { bx=300; hole=Math.floor(Math.random()*120)+30; }
                if(py>250 || py<0 || (bx<50 && bx>10 && (py<hole || py>hole+gap))) {
                    py=130; vy=0; bx=300;
                }
                ctx.fillStyle="#111"; ctx.fillRect(0,0,300,260);
                ctx.fillStyle="#00ffcc"; ctx.fillRect(30, py, 15, 15);
                ctx.fillStyle="#ff5555";
                ctx.fillRect(bx, 0, 30, hole);
                ctx.fillRect(bx, hole+gap, 30, 260-(hole+gap));
            }, 20);
        }

        function play2048() {
            stopGame();
            inst.innerText = "Arrow Keys to combine numbers";
            area.innerHTML = '<div id="g2048" style="display:grid; grid-template-columns:repeat(4,48px); gap:5px; background:#333; padding:5px; border-radius:5px;"></div>';
            let board = Array(16).fill(0);
            
            function addTile() {
                let empty = board.map((v,i)=>v===0?i:null).filter(v=>v!==null);
                if(empty.length) board[empty[Math.floor(Math.random()*empty.length)]] = Math.random()<0.9?2:4;
            }
            function draw() {
                const el = document.getElementById('g2048');
                if(!el) return;
                el.innerHTML = '';
                board.forEach(v => {
                    let d = document.createElement('div');
                    d.style.cssText = `width:48px;height:48px;background:${v? '#00ffcc':'#222'};color:#000;display:flex;align-items:center;justify-content:center;font-weight:bold;border-radius:4px;`;
                    d.innerText = v ? v : '';
                    el.appendChild(d);
                });
            }
            addTile(); addTile(); draw();

            window.onkeydown = function(e) {
                if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
                    addTile(); draw();
                }
            };
        }

        function playBreakout() {
            stopGame();
            inst.innerText = "LEFT and RIGHT arrows to move paddle";
            area.innerHTML = '<canvas id="gc" width="300" height="260" style="background:#111;"></canvas>';
            const canvas = document.getElementById('gc');
            const ctx = canvas.getContext('2d');
            let px=120, bx=150, by=180, dx=2, dy=-2;
            let bricks = [];
            for(let r=0;r<3;r++) for(let c=0;c<5;c++) bricks.push({x:c*55+12, y:r*20+20, status:1});

            window.onkeydown = function(e) {
                if(e.key==='ArrowLeft' && px>0) px-=15;
                if(e.key==='ArrowRight' && px<240) px+=15;
            };

            timer = setInterval(function() {
                bx+=dx; by+=dy;
                if(bx<=0 || bx>=295) dx=-dx;
                if(by<=0) dy=-dy;
                if(by>=240 && bx>=px && bx<=px+60) dy=-dy;
                if(by>260) { bx=150; by=180; dy=-2; }

                bricks.forEach(b => {
                    if(b.status===1 && bx>=b.x && bx<=b.x+50 && by>=b.y && by<=b.y+15) {
                        dy=-dy; b.status=0;
                    }
                });

                ctx.fillStyle="#111"; ctx.fillRect(0,0,300,260);
                ctx.fillStyle="#00ffcc"; ctx.fillRect(px, 245, 60, 10);
                ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle="#ff5555";
                bricks.forEach(b => { if(b.status===1) ctx.fillRect(b.x, b.y, 50, 15); });
            }, 20);
        }
    </script>
</body>
</html>
