<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Classroom</title>
    <link id="favicon" rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png" type="image/png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        #sidebar {
            width: 280px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            gap: 12px;
            overflow-y: auto;
        }

        #sidebar h1 {
            font-size: 1.1rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 8px;
            border-bottom: 1px solid #334155;
        }

        .category-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #38bdf8;
            margin-top: 8px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .game-btn {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-btn:hover {
            background-color: #0284c7;
            color: #ffffff;
        }

        .tag {
            font-size: 0.65rem;
            background-color: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            color: #94a3b8;
        }

        /* Main Content Frame */
        #content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #020617;
            position: relative;
        }

        #topbar {
            height: 50px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        #game-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .ctrl-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .ctrl-btn:hover {
            background-color: #0284c7;
        }

        .btn-panic {
            background-color: #dc2626;
        }
        .btn-panic:hover {
            background-color: #ef4444;
        }

        #game-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }

        /* Panic Screen Overlay */
        #panic-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 999999;
        }

        #panic-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Unblocked Hub</h1>

        <div class="category-title">Roblox & Cloud Gaming</div>
        <button class="game-btn" onclick="launchBlank('https://now.gg/play/roblox-corporation/5349/roblox')">Roblox (Cloud) <span class="tag">about:blank</span></button>
        <button class="game-btn" onclick="launchBlank('https://www.xbox.com/en-US/play')">Xbox Cloud Gaming <span class="tag">about:blank</span></button>
        <button class="game-btn" onclick="launchBlank('https://play.geforcenow.com')">GeForce NOW <span class="tag">about:blank</span></button>

        <div class="category-title">Minecraft & Sandbox</div>
        <button class="game-btn" onclick="loadGame('https://eaglercraft.com/mc/1.8.8/')">Eaglercraft 1.8.8 <span class="tag">Embed</span></button>
        <button class="game-btn" onclick="launchBlank('https://eaglercraft.com/mc/1.8.8/')">Eaglercraft <span class="tag">about:blank</span></button>

        <div class="category-title">Unblocked Arcades</div>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/slope')">Slope 3D</button>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/drift_hunters')">Drift Hunters</button>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/moto_x3m')">Moto X3M</button>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/retro_bowl')">Retro Bowl</button>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/vex_7')">Vex 7</button>

        <div class="category-title">Custom Local Files</div>
        <input type="file" id="html-upload" accept=".html" style="display: none;" onchange="loadLocalHTML(event)">
        <button class="game-btn" onclick="document.getElementById('html-upload').click()">📁 Load Local .HTML Game</button>
    </div>

    <div id="content">
        <div id="topbar">
            <div id="game-title">Select a game from the sidebar</div>
            <div class="controls">
                <button class="ctrl-btn" onclick="openCurrentInBlank()">Launch in Stealth Tab</button>
                <button class="ctrl-btn" onclick="reloadGame()">Reload</button>
                <button class="ctrl-btn" onclick="toggleFullscreen()">Fullscreen</button>
                <button class="ctrl-btn btn-panic" onclick="triggerPanic()">Panic (P)</button>
            </div>
        </div>
        <iframe id="game-frame" src="about:blank" allow="autoplay; gamepad; fullscreen; microphone; clipboard-read; clipboard-write;" allowfullscreen></iframe>
    </div>

    <!-- Fake Google Classroom Disguise Overlay -->
    <div id="panic-screen">
        <iframe src="https://classroom.google.com"></iframe>
    </div>

    <script>
        const iframe = document.getElementById('game-frame');
        const titleDisplay = document.getElementById('game-title');
        let currentUrl = 'about:blank';

        function loadGame(url, name) {
            currentUrl = url;
            iframe.src = url;
            if (name) titleDisplay.innerText = name;
        }

        // Stealth Launcher (about:blank) - Bypasses Extension Filters & X-Frame-Options
        function launchBlank(url) {
            const win = window.open('about:blank', '_blank');
            if (!win) {
                alert('Pop-up blocked! Please allow pop-ups for this website.');
                return;
            }
            win.document.title = "Google Drive";
            
            const link = win.document.createElement('link');
            link.rel = 'icon';
            link.href = 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png';
            win.document.head.appendChild(link);

            const embed = win.document.createElement('iframe');
            embed.src = url;
            embed.style.width = '100vw';
            embed.style.height = '100vh';
            embed.style.border = 'none';
            embed.style.position = 'fixed';
            embed.style.top = '0';
            embed.style.left = '0';
            embed.allow = "autoplay; gamepad; fullscreen; microphone; clipboard-read; clipboard-write;";
            
            win.document.body.style.margin = '0';
            win.document.body.appendChild(embed);
        }

        function openCurrentInBlank() {
            if (currentUrl && currentUrl !== 'about:blank') {
                launchBlank(currentUrl);
            }
        }

        function reloadGame() {
            iframe.src = iframe.src;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                iframe.requestFullscreen().catch(err => {
                    alert(`Fullscreen Error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Local HTML File Loader for Eaglercraft or custom offline games
        function loadLocalHTML(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    iframe.srcdoc = e.target.result;
                    titleDisplay.innerText = "Local Game: " + file.name;
                };
                reader.readAsText(file);
            }
        }

        // Panic Hotkey Logic (Press 'P' or 'Esc' to instantly disguise)
        function triggerPanic() {
            const panic = document.getElementById('panic-screen');
            panic.style.display = 'block';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'p' || e.key === 'Escape') {
                triggerPanic();
            }
        });
    </script>
</body>
</html>
