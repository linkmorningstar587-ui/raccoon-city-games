<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Arcade</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #0d1117;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--accent-color);
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    input[type="text"], select {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid #30363d;
      background-color: var(--card-bg);
      color: var(--text-color);
      outline: none;
    }

    main {
      padding: 2rem;
      flex: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 1.25rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      border-color: var(--accent-color);
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .card span {
      font-size: 0.8rem;
      color: var(--text-muted);
      background-color: #0f172a;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      width: fit-content;
    }

    /* Modal Overlay for Game Embed */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-header {
      width: 90%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .close-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .iframe-container {
      width: 90%;
      max-width: 900px;
      height: 80vh;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Browser Arcade</h1>
    <div class="controls">
      <input type="text" id="search" placeholder="Search games..." oninput="filterGames()">
      <select id="category" onchange="filterGames()">
        <option value="all">All Categories</option>
        <option value="Puzzle">Puzzle</option>
        <option value="Arcade">Arcade</option>
        <option value="Action">Action</option>
      </select>
    </div>
  </header>

  <main>
    <div class="grid" id="game-grid"></div>
  </main>

  <!-- Game Modal -->
  <div class="modal" id="game-modal">
    <div class="modal-header">
      <h2 id="modal-title">Playing Game</h2>
      <button class="close-btn" onclick="closeGame()">Close Game ✕</button>
    </div>
    <div class="iframe-container">
      <iframe id="game-frame" src="" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // Embedded game list (using open-source web games)
    const games = [
      {
        title: "2048",
        category: "Puzzle",
        url: "https://play2048.co/"
      },
      {
        title: "Hextris",
        category: "Puzzle",
        url: "https://hextris.io/"
      },
      {
        title: "Pacman Canvas",
        category: "Arcade",
        url: "https://pacman-canvas.js.org/"
      },
      {
        title: "Paper.io 2",
        category: "Action",
        url: "https://paper-io.com/"
      }
    ];

    const grid = document.getElementById('game-grid');
    const modal = document.getElementById('game-modal');
    const frame = document.getElementById('game-frame');
    const modalTitle = document.getElementById('modal-title');

    function renderGames(list) {
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted)">No games found.</p>';
        return;
      }
      list.forEach(game => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openGame(game.title, game.url);
        card.innerHTML = `
          <h3>${game.title}</h3>
          <span>${game.category}</span>
        `;
        grid.appendChild(card);
      });
    }

    function filterGames() {
      const searchVal = document.getElementById('search').value.toLowerCase();
      const catVal = document.getElementById('category').value;

      const filtered = games.filter(game => {
        const matchesSearch = game.title.toLowerCase().includes(searchVal);
        const matchesCat = catVal === 'all' || game.category === catVal;
        return matchesSearch && matchesCat;
      });

      renderGames(filtered);
    }

    function openGame(title, url) {
      modalTitle.innerText = title;
      frame.src = url;
      modal.classList.add('active');
    }

    function closeGame() {
      modal.classList.remove('active');
      frame.src = '';
    }

    // Initial Load
    renderGames(games);
  </script>

</body>
</html>
