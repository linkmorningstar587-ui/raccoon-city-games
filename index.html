<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes - Google Classroom</title>
    <link rel="icon" type="image/x-icon" href="https://ssl.gstatic.com/classroom/favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .container { width: 100%; max-width: 950px; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .top-bar h1 { color: #58a6ff; font-size: 1.1rem; letter-spacing: 0.5px; }

        .panic-config {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #8b949e;
        }

        .panic-config select {
            background: #0d1117;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 5px 8px;
            border-radius: 4px;
            outline: none;
        }

        .panic-btn {
            background: #da3633;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .panic-btn:hover { background: #f85149; }

        .viewport {
            background: #000;
            border: 1px solid #30363d;
            border-radius: 8px;
            height: 500px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        #game-area {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #emulator-container {
            width: 100%;
            height: 100%;
        }

        .cat-title {
            color: #58a6ff;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0 10px 0;
            border-bottom: 1px solid #21262d;
            padding-bottom: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            background: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px 6px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            font-size: 0.8rem;
            transition: 0.15s ease;
            user-select: none;
        }
        .btn:hover {
            border-color: #58a6ff;
            background: #21262d;
            color: #58a6ff;
        }

        .btn-green { border-color: #2ea043; color: #3fb950; }
        .btn-green:hover { background: #238636; color: #fff; }

        .file-input { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOP CONTROLS & PANIC KEY -->
        <div class="top-bar">
            <h1>LOCAL UNBLOCKED HUB</h1>
            <div class="panic-config">
                <span>Panic Key: <b>~</b> or <b>Esc</b></span>
                <select id="panic-target">
                    <option value="https://www.google.com">Google Search</option>
                    <option value="https://classroom.google.com">Google Classroom</option>
                    <option value="https://canvas.instructure.com">Canvas</option>
                    <option value="https://docs.google.com">Google Docs</option>
                </select>
                <button class="panic-btn" onclick="triggerPanic()">PANIC NOW</button>
            </div>
        </div>

        <!-- MAIN GAME VIEWPORT -->
        <div class="viewport">
            <div id="game-area">
                <p style="color: #8b949e; text-align: center;">Select your ROM file below to mount the active emulator core.</p>
            </div>
        </div>

        <!-- ROM EMULATOR LOADERS -->
        <div class="cat-title" style="color: #3fb950;">Retro ROM Core Launcher</div>
        <div class="grid">
            <button class="btn btn-green" onclick="triggerRomUpload('n64')">Load N64 ROM (.z64 / .n64)</button>
            <button class="btn btn-green" onclick="triggerRomUpload('gba')">Load GBA ROM (.gba)</button>
            <input type="file" id="rom-file-input" class="file-input" accept=".z64,.n64,.v64,.gba,.zip" onchange="loadLocalRom(event)">
        </div>

        <!-- LOCAL CANVAS GAMES -->
        <div class="cat-title">Self-Contained Canvas Arcade</div>
        <div class="grid">
            <button class="btn" onclick="playSnake()">Snake</button>
            <button class="btn" onclick="playPong()">Pong</button>
            <button class="btn" onclick="playFlappy()">Flappy Box</button>
            <button class="btn" onclick="playBreakout()">Breakout</button>
        </div>
    </div>

    <script>
        const area = document.getElementById('game-area');
        let selectedSystem = 'n64';

        /* PANIC KEY SYSTEM (~ OR ESC) */
        function triggerPanic() {
            const target = document.getElementById('panic-target').value;
            window.location.href = target;
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === '`' || e.key === '~' || e.key === 'Escape') {
                triggerPanic();
            }
        });

        function triggerRomUpload(system) {
            selectedSystem = system;
            document.getElementById('rom-file-input').click();
        }

        function loadLocalRom(e) {
            const file = e.target.files[0];
            if (!file) return;

            area.innerHTML = '<div id="emulator-container"></div>';

            const blobUrl = URL.createObjectURL(file);

            window.EJS_player = '#emulator-container';
            window.EJS_gameUrl = blobUrl;
            window.EJS_core = selectedSystem === 'gba' ? 'gba' : 'n64';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            script.onload = () => {
                console.log('Emulator core successfully initialized.');
            };
            document.body.appendChild(script);
        }

        /* SIMPLE CANVAS FALLBACKS */
        function playSnake() {
            area.innerHTML = '<canvas id="gc" width="400" height="400" style="background:#0d1117;"></canvas>';
            const ctx = document.getElementById('gc').getContext('2d');
            let px=10, py=10, gs=20, tc=20, ax=15, ay=15, xv=1, yv=0, trail=[], tail=5;
            window.onkeydown = e => {
                if(e.key==='ArrowLeft' && xv!==1) {xv=-1;yv=0;} if(e.key==='ArrowUp' && yv!==1) {xv=0;yv=-1;}
                if(e.key==='ArrowRight' && xv!==-1) {xv=1;yv=0;} if(e.key==='ArrowDown' && yv!==-1) {xv=0;yv=-1;}
            };
            setInterval(() => {
                px+=xv; py+=yv; if(px<0) px=tc-1; if(px>tc-1) px=0; if(py<0) py=tc-1; if(py>tc-1) py=0;
                ctx.fillStyle="#0d1117"; ctx.fillRect(0,0,400,400);
                ctx.fillStyle="#58a6ff"; for(let i=0;i<trail.length;i++) { ctx.fillRect(trail[i].x*gs, trail[i].y*gs, gs-2, gs-2); }
                trail.push({x:px,y:py}); while(trail.length>tail) trail.shift();
                if(ax===px && ay===py) { tail++; ax=Math.floor(Math.random()*tc); ay=Math.floor(Math.random()*tc); }
                ctx.fillStyle="#f85149"; ctx.fillRect(ax*gs, ay*gs, gs-2, gs-2);
            }, 80);
        }

        function playPong() {
            area.innerHTML = '<canvas id="gc" width="500" height="350" style="background:#0d1117;"></canvas>';
            const ctx = document.getElementById('gc').getContext('2d');
            let py=140, p2y=140, bx=250, by=175, dx=4, dy=4;
            window.onkeydown = e => { if(e.key==='ArrowUp' && py>0) py-=25; if(e.key==='ArrowDown' && py<270) py+=25; };
            setInterval(() => {
                bx+=dx; by+=dy; if(by<=0 || by>=340) dy=-dy;
                if(by > p2y+40 && p2y<270) p2y+=3; if(by < p2y+40 && p2y>0) p2y-=3;
                if(bx<=15 && by>=py && by<=py+80) dx=-dx; if(bx>=475 && by>=p2y && by<=p2y+80) dx=-dx;
                if(bx<0 || bx>500) { bx=250; by=175; }
                ctx.fillStyle="#0d1117"; ctx.fillRect(0,0,500,350);
                ctx.fillStyle="#58a6ff"; ctx.fillRect(5, py, 10, 80); ctx.fillRect(485, p2y, 10, 80);
                ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI*2); ctx.fill();
            }, 20);
        }

        function playFlappy() {
            area.innerHTML = '<canvas id="gc" width="400" height="380" style="background:#0d1117;"></canvas>';
            const ctx = document.getElementById('gc').getContext('2d');
            let py=180, vy=0, bx=400, hole=120;
            window.onkeydown = e => { if(e.code==='Space') vy=-7; };
            setInterval(() => {
                vy+=0.45; py+=vy; bx-=3.5; if(bx<-40) { bx=400; hole=Math.floor(Math.random()*180)+50; }
                if(py>360 || py<0) { py=180; vy=0; }
                ctx.fillStyle="#0d1117"; ctx.fillRect(0,0,400,380);
                ctx.fillStyle="#58a6ff"; ctx.fillRect(50, py, 20, 20);
                ctx.fillStyle="#f85149"; ctx.fillRect(bx, 0, 35, hole); ctx.fillRect(bx, hole+110, 35, 380-(hole+110));
            }, 20);
        }

        function playBreakout() {
            area.innerHTML = '<canvas id="gc" width="480" height="360" style="background:#0d1117;"></canvas>';
            const ctx = document.getElementById('gc').getContext('2d');
            let px=200, bx=240, by=300, dx=3, dy=-3;
            window.onkeydown = e => { if(e.key==='ArrowLeft' && px>0) px-=25; if(e.key==='ArrowRight' && px<400) px+=25; };
            setInterval(() => {
                bx+=dx; by+=dy;
                if(bx<=0 || bx>=470) dx=-dx; if(by<=0) dy=-dy;
                if(by>=330 && bx>=px && bx<=px+80) dy=-dy;
                if(by>360) { bx=240; by=300; dy=-3; }
                ctx.fillStyle="#0d1117"; ctx.fillRect(0,0,480,360);
                ctx.fillStyle="#58a6ff"; ctx.fillRect(px, 340, 80, 10);
                ctx.fillStyle="#3fb950"; ctx.fillRect(bx, by, 10, 10);
            }, 20);
        }
    </script>
</body>
</html>
