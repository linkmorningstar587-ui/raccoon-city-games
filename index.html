<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TAB CLOAK: LOOKS LIKE GOOGLE CLASSROOM -->
    <title>Classes - Google Classroom</title>
    <link rel="icon" type="image/x-icon" href="https://ssl.gstatic.com/classroom/favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f141c;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .container { width: 100%; max-width: 1000px; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .top-bar h1 { color: #58a6ff; font-size: 1.2rem; letter-spacing: 0.5px; }

        .panic-config {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #8b949e;
        }

        .panic-config select {
            background: #0d1117;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 5px 8px;
            border-radius: 4px;
            outline: none;
        }

        .panic-btn {
            background: #da3633;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .panic-btn:hover { background: #f85149; }

        .viewport {
            background: #000;
            border: 1px solid #30363d;
            border-radius: 8px;
            height: 520px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .placeholder-text {
            color: #8b949e;
            text-align: center;
        }

        .cat-title {
            color: #58a6ff;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0 10px 0;
            border-bottom: 1px solid #21262d;
            padding-bottom: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            background: #161b22;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px 6px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            font-size: 0.8rem;
            transition: 0.15s ease;
            user-select: none;
        }
        .btn:hover {
            border-color: #58a6ff;
            background: #21262d;
            color: #58a6ff;
        }

        .btn-zelda { border-color: #2ea043; color: #3fb950; }
        .btn-zelda:hover { background: #238636; color: #fff; }

        .file-input { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOP CONTROLS & PANIC KEY INFO -->
        <div class="top-bar">
            <h1>UNBLOCKED 76 HUB</h1>
            <div class="panic-config">
                <span>Panic Key: <b>~</b> or <b>Esc</b></span>
                <select id="panic-target">
                    <option value="https://classroom.google.com">Google Classroom</option>
                    <option value="https://canvas.instructure.com">Canvas</option>
                    <option value="https://docs.google.com">Google Docs</option>
                    <option value="https://www.google.com">Google Search</option>
                </select>
                <button class="panic-btn" onclick="triggerPanic()">PANIC NOW</button>
            </div>
        </div>

        <!-- MAIN EMBED GAME VIEWPORT -->
        <div class="viewport" id="viewport-box">
            <div id="placeholder" class="placeholder-text">
                <h3>Select any game below to launch</h3>
                <p style="font-size: 0.8rem; margin-top: 5px;">Press <b>~</b> or <b>Esc</b> anytime to immediately panic hide this page.</p>
            </div>
        </div>

        <!-- 1. ZELDA & RETRO ROM LOADERS -->
        <div class="cat-title">Zelda & N64/GBA Engine (Direct Local Loader)</div>
        <div class="grid">
            <button class="btn btn-zelda" onclick="loadEmu('OoT')">Zelda: OoT</button>
            <button class="btn btn-zelda" onclick="loadEmu('MM')">Zelda: MM</button>
            <button class="btn btn-zelda" onclick="loadEmu('MinishCap')">Zelda: Minish Cap</button>
            <button class="btn btn-zelda" onclick="triggerRomUpload()">Upload ROM File</button>
            <input type="file" id="rom-file-input" class="file-input" accept=".z64,.n64,.v64,.gba" onchange="handleRomUpload(event)">
        </div>

        <!-- 2. POPULAR 76 EMBEDS -->
        <div class="cat-title">Unblocked Hits (Embed Engine)</div>
        <div class="grid">
            <button class="btn" onclick="loadGame('https://game337331.konggames.com/gamez/0033/7331/live/index.html')">Slope</button>
            <button class="btn" onclick="loadGame('https://1v1.lol')">1v1.LOL</button>
            <button class="btn" onclick="loadGame('https://retrobowl.me')">Retro Bowl</button>
            <button class="btn" onclick="loadGame('https://drivemad.me')">Drive Mad</button>
            <button class="btn" onclick="loadGame('https://geometrydash.io')">Geometry Dash</button>
            <button class="btn" onclick="loadGame('https://tunnelrush.org')">Tunnel Rush</button>
            <button class="btn" onclick="loadGame('https://paperio2.com')">Paper.io 2</button>

            <button class="btn" onclick="loadGame('https://shellshock.io')">Shell Shockers</button>
            <button class="btn" onclick="loadGame('https://crossyroad.me')">Crossy Road</button>

            <button class="btn" onclick="loadGame('https://drifthunters.org')">Drift Hunters</button>

            <button class="btn" onclick="loadGame('https://bitlifeonline.com')">BitLife</button>
            <button class="btn" onclick="loadGame('https://cluster-rush.com')">Cluster Rush</button>
        </div>
    </div>

    <script>
        const viewportBox = document.getElementById('viewport-box');

        /* PANIC KEY SYSTEM (~ OR ESC) */
        function triggerPanic() {
            const target = document.getElementById('panic-target').value;
            window.location.href = target;
        }

        window.addEventListener('keydown', function(e) {
            if (e.key === '`' || e.key === '~' || e.key === 'Escape') {
                triggerPanic();
            }
        });

        /* GAME EMBED LAUNCHER */
        function loadGame(url) {
            viewportBox.innerHTML = `<iframe id="game-frame" src="${url}" allowfullscreen></iframe>`;
        }

        /* RETRO EMULATOR ENGINE */
        function loadEmu(game) {
            viewportBox.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <h3 style="color: #2ea043; margin-bottom: 10px;">${game} Engine Ready</h3>
                    <p style="color: #8b949e; font-size: 0.85rem; max-width: 400px; margin: 0 auto 15px auto;">
                        To bypass school network blocks, click below to load your local <b>${game}</b> ROM file directly from your USB drive or local storage.
                    </p>
                    <button class="btn btn-zelda" style="padding: 10px 20px;" onclick="triggerRomUpload()">Select ${game} ROM File</button>
                </div>
            `;
        }

        function triggerRomUpload() {
            document.getElementById('rom-file-input').click();
        }

        function handleRomUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            viewportBox.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <h3 style="color: #3fb950;">Loaded: ${file.name}</h3>
                    <p style="color: #58a6ff; font-size: 0.85rem; margin-top: 10px;">ROM buffered in browser memory. Running 100% offline.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
