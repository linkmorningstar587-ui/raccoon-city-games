<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Arcade & Cloud Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        #sidebar {
            width: 280px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            gap: 15px;
        }

        #sidebar h1 {
            font-size: 1.2rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .category-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94a3b8;
            margin-top: 10px;
            font-weight: bold;
        }

        .game-btn {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .game-btn:hover, .game-btn.active {
            background-color: #0284c7;
            color: #ffffff;
            font-weight: bold;
        }

        /* Main Game Display Area */
        #content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #020617;
        }

        #topbar {
            height: 50px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        #game-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .ctrl-btn:hover {
            background-color: #475569;
        }

        #game-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Arcade Hub</h1>

        <div class="category-title">Cloud & Sandbox</div>
        <button class="game-btn active" onclick="loadGame('https://now.gg/play/roblox-corporation/5349/roblox', 'Roblox (Cloud)')">Roblox</button>
        <button class="game-btn" onclick="loadGame('https://eaglercraft.com/mc/1.8.8/', 'Eaglercraft 1.8.8')">Eaglercraft 1.8.8</button>
        <button class="game-btn" onclick="loadGame('https://eaglercraft.ru/', 'Eaglercraft (Alt Mirror)')">Eaglercraft (Alt)</button>

        <div class="category-title">Android & Cloud Streaming</div>
        <button class="game-btn" onclick="loadGame('https://www.xbox.com/en-US/play', 'Xbox Cloud Gaming')">Xbox Cloud Gaming</button>
        <button class="game-btn" onclick="loadGame('https://play.geforcenow.com', 'GeForce NOW')">GeForce NOW</button>
        <button class="game-btn" onclick="loadGame('https://luna.amazon.com', 'Amazon Luna')">Amazon Luna</button>

        <div class="category-title">Action & Driving</div>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/slope', 'Slope')">Slope</button>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/drift_hunters', 'Drift Hunters')">Drift Hunters</button>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/moto_x3m', 'Moto X3M')">Moto X3M</button>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/vex_7', 'Vex 7')">Vex 7</button>

        <div class="category-title">Strategy & Casual</div>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/retro_bowl', 'Retro Bowl')">Retro Bowl</button>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/bloons_tower_defense_5', 'Bloons TD 5')">Bloons TD 5</button>
        <button class="game-btn" onclick="loadGame('https://y8.com/embed/bitlife_online', 'BitLife')">BitLife</button>

        <div class="category-title">Multiplayer & Shooter</div>
        <button class="game-btn" onclick="loadGame('https://1v1.lol', '1v1.LOL')">1v1.LOL</button>
        <button class="game-btn" onclick="loadGame('https://shellshock.io', 'Shell Shockers')">Shell Shockers</button>
        <button class="game-btn" onclick="loadGame('https://smashkarts.io', 'Smash Karts')">Smash Karts</button>
    </div>

    <div id="content">
        <div id="topbar">
            <div id="game-title">Roblox</div>
            <div class="controls">
                <button class="ctrl-btn" onclick="openDirect()">Open in Tab (If Blocked)</button>
                <button class="ctrl-btn" onclick="reloadGame()">Reload</button>
                <button class="ctrl-btn" onclick="toggleFullscreen()">Fullscreen</button>
            </div>
        </div>
        <iframe id="game-frame" src="https://now.gg/play/roblox-corporation/5349/roblox" allow="autoplay; gamepad; fullscreen; microphone;" allowfullscreen></iframe>
    </div>
