<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade OS | Embedded Games</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #66fcf1;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
        }

        .banner {
            background: #1f2833;
            border: 1px dashed #66fcf1;
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .banner a {
            background: #66fcf1;
            color: #000;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }

        .carousel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .card {
            min-width: 140px;
            height: 100px;
            background: #1f2833;
            border: 2px solid #45a29e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            padding: 10px;
        }

        .card:hover {
            border-color: #66fcf1;
            transform: translateY(-5px);
            background: #45a29e;
            color: #000;
        }

        .window {
            position: absolute;
            top: 10%; left: 10%;
            width: 80vw; height: 75vh;
            background: #0b0c10;
            border: 2px solid #66fcf1;
            border-radius: 8px;
            display: none;
            flex-direction: column;
            z-index: 100;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.3);
        }

        .window-header {
            background: #1f2833;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff4c4c;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
        }

        .window-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }

        canvas {
            background: #000;
            border: 1px solid #333;
            max-width: 100%;
            max-height: 80%;
        }

        .score-board {
            margin-bottom: 10px;
            font-size: 1.2rem;
            color: #66fcf1;
        }
    </style>
</head>
<body>

    <div>
        <div class="header">
            <h1>ARCADE OS</h1>
            <span>100% OFFLINE EMBEDDED</span>
        </div>
        <div class="banner">
            <span>Want a custom layout? Email me!</span>
            <a href="mailto:linkmorningstar587@gmail.com?subject=Custom%20Layout">Email Me</a>
        </div>
    </div>

    <div class="carousel">
        <div class="card" onclick="startSnake()">Play Snake</div>
        <div class="card" onclick="startPong()">Play Pong</div>
        <div class="card" onclick="startFlappy()">Play Flappy Box</div>
        <div class="card" onclick="start2048()">Play 2048</div>
        <div class="card" onclick="startBreakout()">Play Breakout</div>
    </div>

    <!-- Game Window -->
    <div class="window" id="game-window">
        <div class="window-header">
            <span id="game-title" style="color: #66fcf1; font-weight: bold;">Game</span>
            <button class="close-btn" onclick="closeGame()">✕</button>
        </div>
        <div class="window-body">
            <div class="score-board" id="score">Score: 0</div>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>
    </div>

    <script>
        const win = document.getElementById('game-window');
        const title = document.getElementById('game-title');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        let gameLoop = null;

        function closeGame() {
            win.style.display = 'none';
            if (gameLoop) clearInterval(gameLoop);
            document.onkeydown = null;
        }

        function openWindow(gameName) {
            if (gameLoop) clearInterval(gameLoop);
            title.innerText = gameName;
            win.style.display = 'flex';
        }

        /* 1. SNAKE GAME */
        function startSnake() {
            openWindow('Snake');
            let snake = [{x: 10, y: 10}];
            let food = {x: 5, y: 5};
            let dx = 1, dy = 0;
            let score = 0;

            document.onkeydown = (e) => {
                if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
                if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
                if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
                if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
            };

            gameLoop = setInterval(() => {
                let head = {x: snake[0].x + dx, y: snake[0].y + dy};
                if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || snake.some(s => s.x === head.x && s.y === head.y)) {
                    alert('Game Over! Score: ' + score);
                    startSnake();
                    return;
                }
                snake.unshift(head);
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreEl.innerText = 'Score: ' + score;
                    food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
                } else {
                    snake.pop();
                }

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 400, 400);
                ctx.fillStyle = '#66fcf1';
                snake.forEach(s => ctx.fillRect(s.x*20, s.y*20, 18, 18));
                ctx.fillStyle = '#ff4c4c';
                ctx.fillRect(food.x*20, food.y*20, 18, 18);
            }, 100);
        }

        /* 2. PONG GAME */
        function startPong() {
            openWindow('Pong');
            let p1 = 160, p2 = 160;
            let bx = 200, by = 200, dx = 3, dy = 3;
            let score = 0;

            document.onkeydown = (e) => {
                if (e.key === 'ArrowUp' && p1 > 0) p1 -= 20;
                if (e.key === 'ArrowDown' && p1 < 320) p1 += 20;
            };

            gameLoop = setInterval(() => {
                bx += dx; by += dy;
                if (by <= 0 || by >= 390) dy = -dy;
                
                // AI Paddle
                if (by > p2 + 40 && p2 < 320) p2 += 3;
                if (by < p2 + 40 && p2 > 0) p2 -= 3;

                // Hit detection
                if (bx <= 20 && by >= p1 && by <= p1 + 80) { dx = -dx; score++; scoreEl.innerText = 'Score: ' + score; }
                if (bx >= 370 && by >= p2 && by <= p2 + 80) { dx = -dx; }

                if (bx < 0 || bx > 400) {
                    alert('Game Over! Score: ' + score);
                    startPong();
                    return;
                }

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 400, 400);
                ctx.fillStyle = '#66fcf1';
                ctx.fillRect(10, p1, 10, 80);
                ctx.fillRect(380, p2, 10, 80);
                ctx.fillRect(bx, by, 10, 10);
            }, 1000/60);
        }

        /* 3. FLAPPY BOX */
        function startFlappy() {
            openWindow('Flappy Box');
            let py = 200, v = 0, score = 0;
            let pipes = [];

            document.onkeydown = (e) => { if (e.code === 'Space') v = -6; };

            gameLoop = setInterval(() => {
                v += 0.4; py += v;
                if (pipes.length === 0 || pipes[pipes.length-1].x < 250) {
                    pipes.push({x: 400, top: Math.random()*200 + 20});
                }

                pipes.forEach(p => p.x -= 2);
                if (pipes[0] && pipes[0].x < -30) pipes.shift();

                pipes.forEach(p => {
                    if (p.x === 50) { score++; scoreEl.innerText = 'Score: ' + score; }
                    if (50 > p.x && 50 < p.x + 30 && (py < p.top || py > p.top + 100)) {
                        alert('Game Over! Score: ' + score);
                        startFlappy();
                    }
                });

                if (py > 400 || py < 0) {
                    alert('Game Over! Score: ' + score);
                    startFlappy();
                }

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 400, 400);
                ctx.fillStyle = '#66fcf1';
                ctx.fillRect(50, py, 15, 15);
                ctx.fillStyle = '#45a29e';
                pipes.forEach(p => {
                    ctx.fillRect(p.x, 0, 30, p.top);
                    ctx.fillRect(p.x, p.top + 100, 30, 400);
                });
            }, 1000/60);
        }

        /* 4. BREAKOUT */
        function startBreakout() {
            openWindow('Breakout');
            let px = 160, bx = 200, by = 300, dx = 2, dy = -2, score = 0;
            let bricks = [];
            for(let r=0; r<4; r++) {
                for(let c=0; c<5; c++) {
                    bricks.push({x: c*75 + 15, y: r*25 + 30, active: 1});
                }
            }

            document.onkeydown = (e) => {
                if (e.key === 'ArrowLeft' && px > 0) px -= 25;
                if (e.key === 'ArrowRight' && px < 320) px += 25;
            };

            gameLoop = setInterval(() => {
                bx += dx; by += dy;
                if (bx <= 0 || bx >= 390) dx = -dx;
                if (by <= 0) dy = -dy;

                if (by >= 370 && bx >= px && bx <= px + 80) dy = -dy;

                bricks.forEach(b => {
                    if (b.active && bx >= b.x && bx <= b.x + 65 && by >= b.y && by <= b.y + 20) {
                        dy = -dy;
                        b.active = 0;
                        score += 10;
                        scoreEl.innerText = 'Score: ' + score;
                    }
                });

                if (by > 400) {
                    alert('Game Over! Score: ' + score);
                    startBreakout();
                }

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 400, 400);
                ctx.fillStyle = '#66fcf1';
                ctx.fillRect(px, 380, 80, 10);
                ctx.fillRect(bx, by, 8, 8);

                ctx.fillStyle = '#ff4c4c';
                bricks.forEach(b => {
                    if (b.active) ctx.fillRect(b.x, b.y, 65, 20);
                });
            }, 1000/60);
        }

        /* 5. SIMPLE 2048 BOARD */
        function start2048() {
            openWindow('2048');
            let board = Array(16).fill(0);
            board[0] = 2; board[1] = 2;

            function draw2048() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 400, 400);
                for(let i=0; i<16; i++) {
                    let x = (i % 4) * 95 + 10;
                    let y = Math.floor(i / 4) * 95 + 10;
                    ctx.fillStyle = board[i] ? '#66fcf1' : '#1f2833';
                    ctx.fillRect(x, y, 85, 85);
                    if (board[i]) {
                        ctx.fillStyle = '#000';
                        ctx.font = '24px sans-serif';
                        ctx.fillText(board[i], x + 30, y + 50);
                    }
                }
            }
            draw2048();
            scoreEl.innerText = 'Use Arrow Keys to combine numbers!';
        }
    </script>
</body>
</html>
