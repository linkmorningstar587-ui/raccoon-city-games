<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade OS | Unblocked Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            filter: brightness(0.35) blur(3px);
            transition: background-image 0.4s ease-in-out;
            z-index: 1;
        }

        .dashboard {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 40px;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-info h1 {
            font-size: 2rem;
            color: #00ffcc;
            text-shadow: 0 0 12px rgba(0,255,204,0.6);
            letter-spacing: 1px;
        }

        .badge-free {
            background-color: #00ffcc;
            color: #000;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .custom-banner {
            background: rgba(22, 27, 34, 0.85);
            border: 1px dashed #00ffcc;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            backdrop-filter: blur(5px);
        }

        .custom-banner p {
            margin: 0;
            font-size: 0.9rem;
            color: #ccc;
        }

        .custom-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .game-title {
            font-size: 2.8rem;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0,255,204,0.5);
            margin-bottom: 5px;
        }

        .carousel {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 15px 0;
            z-index: 2;
        }
        .carousel::-webkit-scrollbar { display: none; }

        .card {
            min-width: 160px;
            height: 220px;
            background-color: #1a1a24;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 12px;
            background-size: cover;
            background-position: center;
        }

        .card:hover {
            transform: scale(1.08);
            border-color: #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
        }

        .card span {
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
        }

        .window {
            position: absolute;
            top: 8%;
            left: 12%;
            width: 76vw;
            height: 80vh;
            background: #11111b;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.35);
            display: none;
            flex-direction: column;
            z-index: 100;
            resize: both;
            overflow: hidden;
            min-width: 450px;
            min-height: 320px;
        }

        .window-header {
            background: #1a1a24;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            border-bottom: 1px solid #333;
        }

        .window-title {
            font-weight: bold;
            color: #00ffcc;
            font-size: 1rem;
        }

        .window-controls button {
            background: none;
            border: none;
            color: #ff5555;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .browser-bar {
            display: flex;
            gap: 10px;
            padding: 8px 12px;
            background: #222230;
        }

        .browser-bar input {
            flex: 1;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #0f0f15;
            color: #fff;
            outline: none;
        }

        .browser-bar button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .window-content {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop autoplay>
        <source src="https://archive.org/download/ResidentEvilOriginalSoundtrack/01%20-%20Main%20Title.mp3" type="audio/mpeg">
    </audio>

    <div id="bg-layer"></div>

    <div class="dashboard">
        <div>
            <div class="header-info">
                <h1>ARCADE OS</h1>
                <span class="badge-free">100% UNBLOCKED</span>
            </div>

            <div class="custom-banner">
                <p><strong>Want your own custom site layout?</strong> Talk to me in person and I can code a personalized dashboard for a snack or money!</p>
                <button class="custom-btn" onclick="alert('Talk to me in person to set up your custom layout!')">Request Custom OS</button>
            </div>
        </div>

        <div class="main-details">
            <div class="game-title" id="active-title">The Legend of Zelda: Ocarina of Time</div>
        </div>

        <div class="carousel">
            <!-- Zelda OOT (Embed Friendly Engine) -->
            <div class="card" 
                 style="background-image: url('https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?auto=format&fit=crop&w=400&q=80');"
                 onmouseenter="previewGame('The Legend of Zelda: Ocarina of Time', 'https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?auto=format&fit=crop&w=1280&q=80')"
                 onclick="openDirectGame('https://emulatoronline.com/n64-games/legend-of-zelda-ocarina-of-time/', 'Zelda: Ocarina of Time')">
                <span>Zelda: Ocarina of Time</span>
            </div>

            <!-- COD Zombies WebGL Port -->
            <div class="card" 
                 style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80');"
                 onmouseenter="previewGame('COD Zombies WebGL', 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1280&q=80')"
                 onclick="openDirectGame('https://html5.gamedistribution.com/rvvAS300/a31c360b947c4333b28b7e6ee57a7e3d/', 'COD Zombies WebGL')">
                <span>COD Zombies</span>
            </div>

            <!-- Pixel Shooter FPS -->
            <div class="card" 
                 style="background-image: url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=400&q=80');"
                 onmouseenter="previewGame('Pixel Gun 3D FPS', 'https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=1280&q=80')"
                 onclick="openDirectGame('https://scratch.mit.edu/projects/10128407/embed', 'Pixel Gun 3D FPS')">
                <span>Pixel Shooter FPS</span>
            </div>

            <!-- Cuphead Port -->
            <div class="card" 
                 style="background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=400&q=80');"
                 onmouseenter="previewGame('Cuphead', 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1280&q=80')"
                 onclick="openDirectGame('https://gn-math.github.io/cuphead/', 'Cuphead')">
                <span>Cuphead</span>
            </div>

            <!-- Super Mario 64 WebGL -->
            <div class="card" 
                 style="background-image: url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=400&q=80');"
                 onmouseenter="previewGame('Super Mario 64', 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1280&q=80')"
                 onclick="openDirectGame('https://sm64js.com/', 'Super Mario 64')">
                <span>Super Mario 64</span>
            </div>

            <!-- Unblocked DuckDuckGo Search -->
            <div class="card" 
                 style="background-image: url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=400&q=80');"
                 onmouseenter="previewGame('Custom Web Browser', 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=1280&q=80')"
                 onclick="openWebBrowser('https://html.duckduckgo.com/html/', 'Custom Browser')">
                <span>Custom Browser</span>
            </div>
        </div>
    </div>

    <!-- Draggable Window -->
    <div class="window" id="app-window">
        <div class="window-header" id="window-drag-handle">
            <span class="window-title" id="win-title">Browser</span>
            <div class="window-controls">
                <button onclick="closeWindow()">✕</button>
            </div>
        </div>
        <div class="browser-bar" id="url-bar-container" style="display:none;">
            <input type="text" id="url-input" placeholder="Search or enter URL...">
            <button onclick="navigateBrowser()">Go</button>
        </div>
        <div id="win-body" style="width:100%; height:100%;"></div>
    </div>

    <script>
        const appWindow = document.getElementById('app-window');
        const winTitle = document.getElementById('win-title');
        const winBody = document.getElementById('win-body');
        const urlBarContainer = document.getElementById('url-bar-container');
        const urlInput = document.getElementById('url-input');
        const bgAudio = document.getElementById('bg-music');

        dragElement(appWindow);

        function previewGame(title, bgUrl) {
            document.getElementById('active-title').innerText = title;
            document.getElementById('bg-layer').style.backgroundImage = `url('${bgUrl}')`;
        }

        function openDirectGame(url, title) {
            bgAudio.pause();
            winTitle.innerText = title;
            urlBarContainer.style.display = "none";
            winBody.innerHTML = `<iframe src="${url}" class="window-content" allowfullscreen allowgamepad sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
            appWindow.style.display = "flex";
        }

        function openWebBrowser(url, title) {
            bgAudio.pause();
            winTitle.innerText = title || "Custom Web Browser";
            urlBarContainer.style.display = "flex";
            urlInput.value = url;
            winBody.innerHTML = `<iframe src="${url}" class="window-content" allowfullscreen allowgamepad sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
            appWindow.style.display = "flex";
        }

        function navigateBrowser() {
            let input = urlInput.value.trim();
            if (!input) return;

            let targetUrl;
            if (input.startsWith('http://') || input.startsWith('https://')) {
                targetUrl = input;
            } else if (input.includes('.') && !input.includes(' ')) {
                targetUrl = 'https://' + input;
            } else {
                targetUrl = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
            }

            winBody.innerHTML = `<iframe src="${targetUrl}" class="window-content" allowfullscreen allowgamepad sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
        }

        function closeWindow() {
            appWindow.style.display = "none";
            winBody.innerHTML = "";
            bgAudio.play();
        }

        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const header = document.getElementById("window-drag-handle");
            if (header) {
                header.onmousedown = dragMouseDown;
            }

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        previewGame('The Legend of Zelda: Ocarina of Time', 'https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?auto=format&fit=crop&w=1280&q=80');
    </script>
</body>
</html>
