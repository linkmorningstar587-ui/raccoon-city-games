<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade OS | Complete Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ffcc;
            padding-bottom: 10px;
        }

        .header h1 { color: #00ffcc; font-size: 1.8rem; }

        .banner {
            background: #161b22;
            border: 1px dashed #00ffcc;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .banner a {
            background: #00ffcc;
            color: #000;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }

        .section-title {
            color: #00ffcc;
            margin-top: 15px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin: 8px 0;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .grid::-webkit-scrollbar { width: 5px; }
        .grid::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

        .btn {
            background: #21262d;
            border: 2px solid #30363d;
            color: #00ffcc;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn:hover { border-color: #00ffcc; background: #30363d; }
        .btn-console { color: #ff79c6; border-color: #ff79c6; }
        .btn-console:hover { background: #ff79c6; color: #000; }
        .btn-heavy { color: #ff5555; border-color: #ff5555; }
        .btn-heavy:hover { background: #ff5555; color: #000; }

        .screen {
            background: #000;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 10px 0;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #emulator-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .file-btn {
            margin-top: 10px;
            padding: 8px 14px;
            background: #21262d;
            border: 1px solid #ff79c6;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div>
        <div class="header">
            <h1>ARCADE OS</h1>
            <span>HYBRID VAULT</span>
        </div>
        <div class="banner">
            <span>Want a custom site layout? Email me!</span>
            <a href="mailto:linkmorningstar587@gmail.com?subject=Custom%20Layout%20Request">Email Me</a>
        </div>
    </div>

    <!-- Main Screen Viewport -->
    <div class="screen">
        <div id="game-container">
            <h2 style="color: #8b949e; text-align: center; padding: 20px;">
                Select an Emulated Title or Heavy Console Game below!
            </h2>
        </div>
    </div>

    <!-- Heavy 3D Consoles (Native Launcher Cards) -->
    <div class="section-title">Heavy 3D Console Launchers (Local/USB)</div>
    <div class="grid">
        <button class="btn btn-heavy" onclick="mountHeavyConsole('Zelda: Breath of the Wild', 'Wii U / Switch', 'Cemu / Azahar', '.wux, .xci, .nsp')">Zelda: BOTW</button>
        <button class="btn btn-heavy" onclick="mountHeavyConsole('Resident Evil 4', 'GameCube / PS2', 'Dolphin / AetherSX2', '.iso, .gcm, .rvz')">Resident Evil 4</button>
        <button class="btn btn-heavy" onclick="mountHeavyConsole('Kingdom Hearts 1', 'PS2', 'AetherSX2 / PCSX2', '.iso, .cso')">Kingdom Hearts 1</button>
        <button class="btn btn-heavy" onclick="mountHeavyConsole('Kingdom Hearts 2', 'PS2', 'AetherSX2 / PCSX2', '.iso, .cso')">Kingdom Hearts 2</button>
    </div>

    <!-- Web-Playable Emulators -->
    <div class="section-title">In-Browser playable (N64 / GBA)</div>
    <div class="grid">
        <button class="btn btn-console" onclick="startEmulator('n64', 'Zelda: Ocarina of Time', 'https://raw.githubusercontent.com/retro-roms/n64/main/zelda_oot.z64')">Zelda: OoT (N64)</button>
        <button class="btn btn-console" onclick="startEmulator('n64', 'Zelda: Majora\'s Mask', 'https://raw.githubusercontent.com/retro-roms/n64/main/zelda_mm.z64')">Zelda: MM (N64)</button>
        <button class="btn btn-console" onclick="startEmulator('gba', 'Zelda: The Minish Cap', 'https://raw.githubusercontent.com/retro-roms/gba/main/minish_cap.gba')">Zelda: Minish Cap (GBA)</button>
        <button class="btn btn-console" onclick="startEmulator('gba', 'Kingdom Hearts: CoM', 'https://raw.githubusercontent.com/retro-roms/gba/main/kh_com.gba')">KH: Chain of Memories (GBA)</button>
    </div>

    <script>
        const container = document.getElementById('game-container');
        let timer = null;

        function stopCurrentInstance() {
            if (timer) clearInterval(timer);
            window.onkeydown = null;
            window.onkeyup = null;
            container.innerHTML = '';
        }

        /* IN-BROWSER EMULATOR CORE */
        function startEmulator(system, title, romUrl) {
            stopCurrentInstance();
            const iframe = document.createElement('iframe');
            iframe.id = 'emulator-iframe';
            iframe.srcdoc = `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
                        #emulator { width: 100%; height: 100%; }
                    </style>
                </head>
                <body>
                    <div id="emulator"></div>
                    <script>
                        EJS_player = '#emulator';
                        EJS_core = '${system}';
                        EJS_gameUrl = '${romUrl}';
                        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
                    <\/script>
                    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"><\/script>
                </body>
                </html>
            `;
            container.appendChild(iframe);
        }

        /* HEAVY CONSOLE MOUNTING ENGINE */
        function mountHeavyConsole(title, platform, recommendedEmulator, formats) {
            stopCurrentInstance();
            container.innerHTML = `
                <div style="text-align:center; padding:20px; max-width: 90%;">
                    <h3 style="color:#ff5555; margin-bottom:8px;">${title}</h3>
                    <p style="color:#00ffcc; font-size:0.85rem; margin-bottom:5px;">Platform: <b>${platform}</b></p>
                    <p style="color:#aaa; font-size:0.8rem; margin-bottom:12px;">Recommended Core: <b>${recommendedEmulator}</b></p>
                    <p style="color:#fff; font-size:0.8rem; margin-bottom:10px;">Select game file from USB/Storage (${formats}):</p>
                    <input type="file" accept="${formats}" class="file-btn" onchange="confirmHeavyMount(event, '${title}')">
                </div>
            `;
        }

        function confirmHeavyMount(e, title) {
            const f = e.target.files[0];
            if(f) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 20px;">
                        <h3 style="color:#00ffcc;">${title} Mounted!</h3>
                        <p style="color:#aaa; font-size:0.85rem; margin-top:8px;">File: <b>${f.name}</b> (${(f.size/(1024*1024*1024)).toFixed(2)} GB)</p>
                        <p style="color:#ff5555; font-size:0.8rem; margin-top:12px;">Notice: Heavy 3D ROM recognized. Open your local standalone emulator app to run at full speed!</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
